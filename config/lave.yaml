# All business content lives here. Text can use {placeholders} from `business`.
# Search for TODO_CONFIRM and fill with the owner before going live.

business:
  name: "Lavê"
  address: "Av. Aviación 4284-1, Jardín Real, Zapopan, Jal."   # TODO_CONFIRM with owner
  hours: "Lunes a viernes 8:00–19:00, sábado 8:00–18:00"         # TODO_CONFIRM with owner
  maps_link: "https://maps.google.com/?q=Av.+Aviación+4284+Jardín+Real+Zapopan"  # TODO_CONFIRM
  review_link: "https://g.page/r/TODO_CONFIRM/review"            # TODO_CONFIRM: Google review link
  review_delay_hours: 24

# Fuzzy-match threshold (0-100). Below this the message counts as "unknown".
match_threshold: 80
# Unknown messages in a row before handing off to a human.
unknown_before_handoff: 2

# Global keywords (accent/case-insensitive, fuzzy).
human_keywords: [hablar con una persona, persona, humano, asesor, agente, operador, alguien del equipo]
cancel_keywords: [cancelar, salir, menu]
yes_words: ["si", "sip", "simon", "claro", "confirmo", "ok", "va", "dale", "correcto", "yes"]  # keep quotes: YAML reads bare yes/no as booleans
no_words: ["no", "nel", "cancelar"]

messages:
  welcome: |
    Hola 👋 Somos {name}, tu lavandería de confianza 🧺✨
    ¿En qué te ayudamos hoy?
  privacy: "🔒 Solo guardamos tu número, nombre, ubicación y pedido para darte servicio."
  list_button: "Ver opciones"   # WhatsApp list button text (max 20 chars)
  unknown: "Uy, no te entendí bien 😅 Te dejo el menú para ayudarte mejor:"
  handoff: "¡Claro! 🙌 En un momento alguien de nuestro equipo te atiende por aquí."
  order_cancelled: "Listo, cancelamos la solicitud. Si quieres empezar de nuevo escribe *recolección* 😊"
  invalid_option: "Elige una de las opciones, por favor 🙏"

# Welcome menu: number -> label + action (faq key, or "human"). On WhatsApp every numbered list
# (this menu, services, pickup slots) is sent as a tap-to-choose list; rows show 24 chars max.
menu:
  "1": {label: "Precios 💲", action: precios}
  "2": {label: "Métodos de pago 💳", action: metodos_pago}
  "3": {label: "Servicios 🧺", action: servicios}
  "4": {label: "Horarios y ubicación 📍", action: horarios}
  "5": {label: "Solicitar recolección 🚗", action: recoleccion}
  "6": {label: "Hablar con una persona 🙋", action: human}

# Keyword FAQ (mirrors staff quick replies). Keywords are matched accent/case-insensitive + fuzzy.
faq:
  # Official pickup process (Lavê Facebook, Mar 4). start_order: reply, then begin the order flow.
  recoleccion:
    keywords: [recoleccion, solicitar recoleccion, pasan por mi ropa, pasen por mi ropa, recogen, a domicilio,
               servicio a domicilio, pedido, hacer un pedido, quiero lavar, agendar, mandar ropa]
    start_order: true
    reply: |
      ¿Quieres solicitar una recolección? 🚗 Solo sigue estos pasos:
      1️⃣ Escríbenos por WhatsApp ✅ (¡ya lo hiciste!)
      2️⃣ Indícanos el servicio que necesitas
      3️⃣ Compártenos tu ubicación
      4️⃣ Elige tu horario
      5️⃣ Nosotros confirmamos la agenda
      Así de fácil 😉
  bienvenida:
    keywords: [hola, buenas, buenos dias, buenas tardes, buenas noches, menu, inicio, hi]
    welcome: true
  precios:
    keywords: [precio, precios, costo, cuanto cuesta, cuanto cobran, tarifa, lista de precios]
    reply: |
      💲 Precios (TODO_CONFIRM con el dueño):
      • Lavandería por kilo: $TODO_CONFIRM /kg (mínimo 3 kg)
      • Auto-lavado (lavadora): $TODO_CONFIRM por carga
      • Tintorería: desde $TODO_CONFIRM por prenda
      • Planchado: $TODO_CONFIRM por prenda / docena $TODO_CONFIRM
      • Edredones y cobijas: desde $TODO_CONFIRM
      • Limpieza de tenis: $TODO_CONFIRM por par
      • Recolección y entrega: $TODO_CONFIRM
      ¿Quieres hacer un pedido? Escribe *pedido* 🧺
  metodos_pago:
    keywords: [metodos de pago, pago, pagar, tarjeta, efectivo, transferencia, aceptan tarjeta]
    reply: "💳 Aceptamos efectivo, tarjeta de débito/crédito y transferencia. (TODO_CONFIRM)"
  servicios:
    keywords: [servicios, que hacen, otros servicios, que servicios, ofrecen]
    reply: |
      🧺 Nuestros servicios:
      • Lavandería (por kilo)
      • Tintorería
      • Planchado
      • Interiores (edredones, cobijas, cortinas)
      • Limpieza de tenis 👟
      Modalidades: auto-lavado, servicio de lavado, y recolección y entrega a domicilio 🚗
  horarios:
    keywords: [horario, horarios, a que hora, abren, cierran, ubicacion, direccion, donde estan, como llego]
    reply: |
      🕗 {hours}
      📍 {address}
      🗺️ {maps_link}
  plancha:
    keywords: [plancha, planchado, planchan]
    reply: "👔 Sí planchamos: camisas, pantalones, vestidos y más. Precio por prenda o por docena. Escribe *precios* para ver la lista."
  perdida:
    keywords: [perdida, perdi, se perdio, falta una prenda, me falta, extravio, extraviada]
    reply: "Lamentamos mucho el inconveniente 😔 Por favor mándanos tu número de nota y la descripción de la prenda; un miembro del equipo lo revisa contigo hoy mismo."
    handoff: true
  barberia:
    keywords: [barberia, toallas, negocio, empresa, b2b, gimnasio, spa, hotel, restaurante]
    reply: "💼 ¡Tenemos plan para negocios! Lavamos toallas, uniformes y blancos con recolección programada. Cuéntanos qué tipo de negocio tienes y cuántas piezas a la semana, y te mandamos cotización 🙌"
  informes:
    keywords: [informes, informacion, info, mas informacion]
    welcome: true
  nuevos:
    keywords: [primera vez, nuevo cliente, soy nuevo, promocion, promo, descuento]
    reply: "🎉 ¡Bienvenido/a! Si es tu primera vez con nosotros pregunta por la promo de nuevo cliente (TODO_CONFIRM). Escribe *pedido* para empezar."
  estudiantes:
    keywords: [tec, estudiante, militar, militares, descuento estudiante]
    reply: "🎓🪖 Atendemos con gusto a estudiantes del Tec, militares y oficinas cercanas. Pregunta por descuentos con tu credencial (TODO_CONFIRM)."
  gracias:
    keywords: [gracias, muchas gracias, ok gracias, perfecto gracias]
    reply: "¡Con gusto! 💙 Aquí estamos para lo que necesites."

order:
  # Steps map 1:1 to the official process: servicio -> ubicación -> horario -> confirmación.
  start: "🧺 ¿Qué servicio necesitas? Responde con el número:"
  services:
    - Lavandería
    - Tintorería
    - Planchado
    - Interiores (edredones, cobijas)
    - Limpieza de tenis
  ask_location: "📍 Compártenos tu *ubicación* de WhatsApp (clip 📎 > Ubicación) o escribe tu dirección completa."
  ask_time: "🕒 ¿En qué horario te queda mejor para la recolección?"
  time_windows:   # TODO_CONFIRM pickup windows with the owner
    - "Mañana 9:00–12:00 (TODO_CONFIRM)"
    - "Mediodía 12:00–15:00 (TODO_CONFIRM)"
    - "Tarde 15:00–18:00 (TODO_CONFIRM)"
  confirm: |
    Revisa tu solicitud de recolección 👇
    • Servicio: {service}
    • Ubicación: {location}
    • Horario: {time_window}
    ¿Todo bien? Responde *sí* para enviarla o *no* para cancelar.
  # Not booked yet: status stays `nuevo` until staff confirm (-> `programado`).
  saved: "¡Recibimos tu solicitud #{order_id}! 🙌 En breve te confirmamos la agenda de tu recolección por aquí."

templates:
  programado: "📅 ¡Agenda confirmada! Pasamos por tu ropa (solicitud #{order_id}) 🕒 {confirmed_slot}. Te avisamos cuando esté lista 🧺"
  listo: |
    🎉 ¡Tu ropa está lista! (solicitud #{order_id})
    Te la llevamos en el horario acordado 🚗, o si prefieres pasa por ella a {address}
    🕗 {hours}
  review: |
    Hola 👋 ¿Cómo te fue con tu pedido en {name}? 💙
    Nos ayudarías muchísimo con una reseña de 1 minuto ⭐⭐⭐⭐⭐
    {review_link}
    ¡Gracias por tu confianza!

# Meta-approved WhatsApp templates for the messages above. WhatsApp only allows free-form text within 24h of
# the customer's last message, and "listo"/review often land later. Register each one in WhatsApp Manager >
# Message templates (category: Utility, language: Spanish (MEX)) with the same wording as `templates`,
# replacing each {placeholder} with {{1}}, {{2}}... in `params` order. Delete an entry to send plain text.
wa_templates:   # TODO_CONFIRM names once Meta approves them
  programado: {name: lave_agenda_confirmada, language: es_MX, params: [order_id, confirmed_slot]}
  listo: {name: lave_ropa_lista, language: es_MX, params: [order_id, address, hours]}
  review: {name: lave_resena, language: es_MX, params: [name, review_link]}
